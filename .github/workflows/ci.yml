name: CI

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U erp" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check app tests
      - name: Tests (SQLite)
        run: uv run pytest -p no:logging
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: uv run pytest -p no:logging
      - name: Migrations up-to-date
        env:
          ERP_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
        run: |
          uv run python -c "import app.models; from app.core.db import Base, engine; Base.metadata.drop_all(engine)"
          uv run alembic upgrade head
          uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cloudsail-erp:ci .
